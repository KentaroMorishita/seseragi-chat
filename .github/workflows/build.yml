name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  chat:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM: kentaromorishitas-projects

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install Seseragi CLI
        run: cargo install --git https://github.com/KentaroMorishita/seseragi --locked seseragi-cli

      - name: Build WebSocket server
        working-directory: server
        run: |
          set -euo pipefail
          seseragi lock update
          seseragi build .

          PROVIDER="dist/node_modules/seseragi/runtime-bun/websocket-server.ts"
          test -f dist/entry.ts
          test -f "$PROVIDER"
          grep -q 'port: request.port' "$PROVIDER"
          sed -i 's/port: request.port,/port: Number(process.env.PORT ?? request.port),/' "$PROVIDER"
          grep -q 'process.env.PORT' "$PROVIDER"

          rm -rf deploy
          mkdir deploy
          tar -C dist -czf deploy/server-dist.tgz .
          tar -tzf deploy/server-dist.tgz | grep -q '^./entry.ts$'
          tar -tzf deploy/server-dist.tgz | grep -q '^./node_modules/seseragi/runtime-bun/websocket-server.ts$'
          cp vercel/Dockerfile.vercel deploy/Dockerfile.vercel

      - name: Build browser client
        working-directory: client
        run: |
          seseragi lock update
          seseragi build .
          test -f dist/index.html

      - name: Reject unresolved generated expressions
        run: |
          if grep -R -n -E '=>[[:space:]]*_;' client/dist server/dist; then
            echo "Generated bundle contains an unresolved Seseragi lowering placeholder."
            exit 1
          fi

      - name: Ensure Vercel project
        if: env.VERCEL_TOKEN != ''
        run: |
          bunx vercel@latest project inspect seseragi-chat \
            --scope "$VERCEL_TEAM" \
            --token "$VERCEL_TOKEN" >/dev/null 2>&1 \
            || bunx vercel@latest project add seseragi-chat \
              --scope "$VERCEL_TEAM" \
              --token "$VERCEL_TOKEN"

      - name: Deploy preview and verify WebSocket broadcast
        if: github.event_name == 'pull_request' && env.VERCEL_TOKEN != ''
        run: |
          DEPLOYMENT_URL="$(bunx vercel@latest deploy . \
            --yes \
            --project seseragi-chat \
            --scope "$VERCEL_TEAM" \
            --token "$VERCEL_TOKEN" \
            --local-config vercel.json)"
          WS_URL="${DEPLOYMENT_URL/https:/wss:}/chat"
          echo "Testing $WS_URL"

          for attempt in 1 2 3 4 5; do
            if bun scripts/websocket-smoke.ts "$WS_URL"; then
              exit 0
            fi
            echo "WebSocket smoke attempt $attempt failed; retrying..."
            sleep 3
          done
          exit 1

      - name: Deploy production and verify WebSocket broadcast
        if: github.event_name != 'pull_request' && env.VERCEL_TOKEN != ''
        run: |
          bunx vercel@latest deploy . \
            --prod \
            --yes \
            --project seseragi-chat \
            --scope "$VERCEL_TEAM" \
            --token "$VERCEL_TOKEN" \
            --local-config vercel.json

          for attempt in 1 2 3 4 5; do
            if bun scripts/websocket-smoke.ts "wss://seseragi-chat.vercel.app/chat"; then
              exit 0
            fi
            echo "WebSocket smoke attempt $attempt failed; retrying..."
            sleep 3
          done
          exit 1
