name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  chat:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM: kentaromorishitas-projects
      VERCEL_SERVER_PROJECT: seseragi-chat-server

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install Seseragi CLI
        run: cargo install --git https://github.com/KentaroMorishita/seseragi --locked seseragi-cli

      - name: Build WebSocket server
        working-directory: server
        run: |
          set -euo pipefail
          seseragi lock update
          seseragi build .

          PROVIDER="dist/node_modules/seseragi/runtime-bun/websocket-server.ts"
          test -f dist/entry.ts
          test -f "$PROVIDER"
          grep -q 'port: request.port' "$PROVIDER"
          sed -i 's/port: request.port,/port: Number(process.env.PORT ?? request.port),/' "$PROVIDER"
          grep -q 'process.env.PORT' "$PROVIDER"

          rm -rf deploy
          mkdir -p deploy/backend
          tar -C dist -czf deploy/backend/server-dist.tgz .
          tar -tzf deploy/backend/server-dist.tgz > deploy/server-dist.list
          grep -q '^./entry.ts$' deploy/server-dist.list
          grep -q '^./node_modules/seseragi/runtime-bun/websocket-server.ts$' deploy/server-dist.list
          rm deploy/server-dist.list
          cp vercel/Dockerfile.vercel deploy/backend/Dockerfile.vercel
          cp vercel/vercel.json deploy/vercel.json

      - name: Build browser client
        working-directory: client
        run: |
          set -euo pipefail
          seseragi lock update
          seseragi build .
          test -f dist/index.html
          test -f dist/assets/app.css

          python - <<'PY'
          from pathlib import Path

          index = Path("dist/index.html")
          html = index.read_text()
          html = html.replace(
              'content="width=device-width, initial-scale=1"',
              'content="width=device-width, initial-scale=1, viewport-fit=cover"',
          )
          index.write_text(html)

          css = Path("dist/assets/app.css")
          css.write_text(
              css.read_text()
              + """

          /* Chat shell: keep iOS browser chrome / keyboard from exposing the page canvas. */
          :root {
            color-scheme: light;
            background: #eef2f7;
          }

          html,
          body,
          #app {
            width: 100%;
            height: 100%;
            min-height: 0;
            margin: 0;
            overflow: hidden;
            background: #eef2f7;
          }

          html,
          body {
            overscroll-behavior: none;
          }

          #app > main {
            position: static !important;
            inset: auto !important;
            width: 100% !important;
            height: 100% !important;
            min-height: 0 !important;
            overflow: hidden !important;
          }
          """
          )
          PY

          grep -q 'viewport-fit=cover' dist/index.html
          grep -q 'color-scheme: light' dist/assets/app.css
          grep -q '#app > main' dist/assets/app.css

      - name: Reject unresolved generated expressions
        run: |
          if grep -R -n -E '=>[[:space:]]*_;' client/dist server/dist; then
            echo "Generated bundle contains an unresolved Seseragi lowering placeholder."
            exit 1
          fi

      - name: Ensure Vercel projects
        if: env.VERCEL_TOKEN != ''
        run: |
          bunx vercel@latest project inspect seseragi-chat \
            --scope "$VERCEL_TEAM" \
            --token "$VERCEL_TOKEN" >/dev/null 2>&1 \
            || bunx vercel@latest project add seseragi-chat \
              --scope "$VERCEL_TEAM" \
              --token "$VERCEL_TOKEN"

          bunx vercel@latest project inspect "$VERCEL_SERVER_PROJECT" \
            --scope "$VERCEL_TEAM" \
            --token "$VERCEL_TOKEN" >/dev/null 2>&1 \
            || bunx vercel@latest project add "$VERCEL_SERVER_PROJECT" \
              --scope "$VERCEL_TEAM" \
              --token "$VERCEL_TOKEN"

      - name: Deploy public WebSocket server and verify broadcast
        if: env.VERCEL_TOKEN != ''
        run: |
          set -euo pipefail
          cd server/deploy
          bunx vercel@latest deploy . \
            --prod \
            --yes \
            --project "$VERCEL_SERVER_PROJECT" \
            --scope "$VERCEL_TEAM" \
            --token "$VERCEL_TOKEN" \
            --local-config vercel.json
          cd ../..

          for attempt in 1 2 3 4 5; do
            if bun scripts/websocket-smoke.ts "wss://seseragi-chat-server.vercel.app/chat"; then
              exit 0
            fi
            echo "WebSocket smoke attempt $attempt failed; retrying..."
            sleep 3
          done
          exit 1

      - name: Deploy browser client to Vercel
        if: github.event_name != 'pull_request' && env.VERCEL_TOKEN != ''
        run: |
          bunx vercel@latest deploy client/dist \
            --prod \
            --yes \
            --project seseragi-chat \
            --scope "$VERCEL_TEAM" \
            --token "$VERCEL_TOKEN"
